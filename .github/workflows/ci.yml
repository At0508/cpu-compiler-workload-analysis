name: LLVM pass build and fixture

on:
  push:
  pull_request:

jobs:
  llvm-pass:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ llvm-18-dev llvm-18-tools clang-18
      - name: Configure
        run: cmake -S . -B build -G Ninja -DLLVM_DIR="$(llvm-config-18 --cmakedir)" -DCMAKE_BUILD_TYPE=Release
      - name: Build pass
        run: cmake --build build --parallel
      - name: Run fixture checks
        run: ctest --test-dir build --output-on-failure
      - name: Record loop analysis and CPU experiment
        run: |
          opt-18 -load-pass-plugin=build/LoopReport.so -passes='function(loop-report)' -disable-output tests/fixtures/loops.ll 2> results/loop_report.txt
          cat results/loop_report.txt
          python3 tools/run_sweep.py --compile --sizes 256,1024 --threads 1,2 --rounds 2 --repetitions 9 --output results/ci_sweep.json
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-and-cpu-results
          path: |
            results/loop_report.txt
            results/ci_sweep.json
            results/ci_sweep.md
